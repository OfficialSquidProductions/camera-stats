name: Field clients
on:
  push:
    branches: [windows-android-field-alpha, shot-reporter-rebrand]
    paths: ['clients/**', 'fixtures/**', 'licenses/clients/**', 'tools/fixtures/**', 'tools/*client*', 'tools/generate_cross_platform_fixtures.py', 'tools/publish_development_evidence.py', '.github/workflows/field-clients.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: field-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clients
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.camera-gradle-ci
      SKIKO_RENDER_API: SOFTWARE_COMPAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Core, persistence, native PDF and Compose UI tests
        run: |
          python ../tools/build_client_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gradlew.bat -PskipAndroid=true :core:test :jdbc:test :desktop:test --no-daemon --console=plain
      - name: Package bundled-runtime Windows clients
        run: ./gradlew.bat -PskipAndroid=true :desktop:createDistributable :desktop:packageExe :desktop:packageMsi --no-daemon --console=plain
      - name: Verify the packaged Windows runtime
        run: |
          $launchers = @(Get-ChildItem -Path desktop/build/compose/binaries/main/app -Recurse -Filter 'Shot Reporter.exe')
          if ($launchers.Count -ne 1) { throw "Expected one packaged Shot Reporter launcher" }
          $qa = Join-Path (Get-Location) 'desktop/build/qa/packaged-runtime'
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $process = Start-Process -FilePath $launchers[0].FullName -ArgumentList '--self-test', ('"' + $qa + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $qa 'PASS.txt'))) { throw "Packaged-runtime check failed" }
          Get-Content (Join-Path $qa 'PASS.txt')
      - name: Install previous public Camera Stats and seed a synthetic report using its own runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-alpha.2 --pattern Camera-Stats-Windows-0.1.0-alpha.2.msi --dir desktop/build/qa/previous --repo "$env:GITHUB_REPOSITORY"
          $old = Join-Path (Get-Location) 'desktop/build/qa/previous/Camera-Stats-Windows-0.1.0-alpha.2.msi'
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a20ae61b1cc88f941edd520531ca18a59fdc23433ed36addb24291f877fdcd0d') { throw 'Previous MSI checksum mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList '/i', ('"' + $old + '"'), '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) { throw "Previous MSI failed: $($install.ExitCode)" }
          $qa = Join-Path (Get-Location) 'desktop/build/qa/previous/report'
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $oldLauncher = Join-Path $env:ProgramFiles 'Camera Stats/Camera Stats.exe'
          $process = Start-Process $oldLauncher -ArgumentList '--self-test', ('"' + $qa + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $qa 'PASS.txt'))) { throw 'Old runtime could not seed report' }
          $data = Join-Path $env:LOCALAPPDATA 'Squid Productions/Camera Stats'
          if (Test-Path $data) { throw 'Upgrade test requires an empty isolated profile' }
          New-Item -ItemType Directory -Path $data | Out-Null
          Copy-Item (Join-Path $qa 'qa.sqlite3') (Join-Path $data 'reports.sqlite3')
          'theme=Dark' | Set-Content (Join-Path $data 'preferences.properties')
      - name: Install and exercise the MSI on the isolated Windows runner
        run: |
          $msi = @(Get-ChildItem desktop/build/compose/binaries/main/msi -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'Expected one MSI' }
          $log = Join-Path (Get-Location) 'desktop/build/qa/msi-install.log'
          $install = Start-Process msiexec.exe -ArgumentList '/i', ('"' + $msi[0].FullName + '"'), '/qn', '/norestart', '/l*v', ('"' + $log + '"') -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) { throw "MSI installation failed: $($install.ExitCode)" }
          $launcher = Join-Path $env:ProgramFiles 'Shot Reporter/Shot Reporter.exe'
          if (!(Test-Path $launcher)) { throw 'Installed launcher is missing' }
          $qa = Join-Path (Get-Location) 'desktop/build/qa/installed-runtime'
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $process = Start-Process $launcher -ArgumentList '--self-test', ('"' + $qa + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $qa 'PASS.txt'))) { throw 'Installed runtime check failed' }
          Get-Content (Join-Path $qa 'PASS.txt')
      - name: Verify installed rebrand preserves the old normal-location report and removes the old product
        run: |
          $launcher = Join-Path $env:ProgramFiles 'Shot Reporter/Shot Reporter.exe'
          $expected = Join-Path (Get-Location) 'desktop/build/qa/previous/report/package-test.camreport'
          $qa = Join-Path (Get-Location) 'desktop/build/qa/rebrand-upgrade'
          $process = Start-Process $launcher -ArgumentList '--verify-report-upgrade', ('"' + $expected + '"'), ('"' + $qa + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $qa 'PASS.txt'))) { throw 'Installed rebrand lost previous report data' }
          if (Test-Path (Join-Path $env:ProgramFiles 'Camera Stats/Camera Stats.exe')) { throw 'Old product was not removed by MSI upgrade' }
          Get-Content (Join-Path $qa 'PASS.txt')
      - name: Preserve development packages and QA in an owner-visible draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../tools/publish_development_evidence.py --label windows --evidence core/build/conformance --evidence core/build/test-results --evidence jdbc/build/test-results --evidence desktop/build/test-results --evidence desktop/build/qa --asset "desktop/build/compose/binaries/main/exe/*.exe" --asset "desktop/build/compose/binaries/main/msi/*.msi"

  android:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_c]
    defaults:
      run:
        working-directory: clients
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.camera-gradle-ci
      ANDROID_AVD_HOME: ${{ github.workspace }}/.camera-avd
      ANDROID_USER_HOME: ${{ github.workspace }}/.camera-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled SDK and build test APKs
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          python3 ../tools/build_client_notices.py
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest :android:assembleRelease --no-daemon --console=plain
      - name: Prepare AOSP emulator without accepting new licenses
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          if ! test -x "$ANDROID_HOME/emulator/emulator"; then timeout 12m "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' </dev/null; fi
          if ! test -d "$ANDROID_HOME/system-images/android-35/default/x86_64"; then timeout 12m "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;default;x86_64' </dev/null; fi
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name camera-qa --path "$ANDROID_AVD_HOME/camera-qa.avd" --package 'system-images;android-35;default;x86_64' --device '${{ matrix.device }}'
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/camera-qa.ini"
          if test -e /dev/kvm; then sudo setfacl -m u:$(id -u):rw /dev/kvm; fi
          trap 'cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd camera-qa -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 90s "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device
          for i in $(seq 1 120); do
            if test "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1'; then exit 0; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Run Android native storage, PDF, lifecycle and UI tests
        run: ./gradlew :android:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Capture emulator image
        if: always()
        run: |
          mkdir -p android/build/qa
          cp "$RUNNER_TEMP/emulator.log" android/build/qa/emulator.log || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 pull /sdcard/Android/data/org.squidproductions.camerastats/files/qa/. android/build/qa/ || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 pull /sdcard/Download/CameraStatsQA/. android/build/qa/ || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out screencap -p > android/build/qa/emulator.png || true
      - name: Preserve development APK and test evidence in an owner-visible draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../tools/publish_development_evidence.py --label android-${{ matrix.device }} --evidence android/build/outputs/androidTest-results --evidence android/build/reports/androidTests --evidence android/build/qa --asset "android/build/outputs/apk/debug/*.apk" --asset "android/build/outputs/apk/release/*unsigned.apk"
      - name: Stop isolated emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
  apple-reader:
    permissions:
      contents: write # GitHub draft evidence requires push access; token remains ephemeral.
    needs: windows
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read Windows conformance evidence from the private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "field-clients-validation-${GITHUB_SHA:0:12}" --pattern windows-evidence.zip --dir validation-output
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          root=Path('validation-output')
          with zipfile.ZipFile(root/'windows-evidence.zip') as z:
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
              z.extractall(root)
          PYTHON
      - name: Regenerate deterministic fixtures with the unchanged Swift core
        run: python3 tools/generate_cross_platform_fixtures.py
      - name: Read Windows-exported packages with unchanged Swift reader
        run: |
          find validation-output -name 'kotlin-*.camreport' -exec /tmp/camerastats-fixture-tool verify {} \;
          test "$(find validation-output -name 'kotlin-*.camreport' | wc -l | tr -d ' ')" = '2'
      - name: Existing Apple regression tests
        run: swift test --package-path app
